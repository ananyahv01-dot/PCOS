services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pcosRoot123!
      MYSQL_DATABASE: pcos_care
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: pcosRoot123!
      DB_NAME: pcos_care
      PCOS_ADMIN_PASS: admin123
      PCOS_DOCTOR_PASS: doctor123
      ALLOWED_ORIGINS: "*"
      FRONTEND_URL: "http://localhost:8000"
    ports:
      - "8000:8000"

  # Browser-based MySQL admin UI (the phpMyAdmin-equivalent XAMPP ships with).
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
