services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pcosRoot123!
      MYSQL_DATABASE: pcos_care
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: pcosRoot123!
      DB_NAME: pcos_care
      PCOS_ADMIN_PASS: admin123
      PCOS_DOCTOR_PASS: doctor123
      ALLOWED_ORIGINS: "*"
      FRONTEND_URL: "http://localhost:8000"
      # No email provider locally: show the reset link on the Forgot password
      # page instead. Keep this off for any public deployment.
      SHOW_RESET_LINK: "true"
    volumes:
      # Uploaded ultrasound scans survive container rebuilds.
      - ultrasound_uploads:/app/artifacts/ultrasounds
    ports:
      - "8000:8000"

  # The actual phpMyAdmin XAMPP ships with, for browsing the MySQL database.
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 50M
    ports:
      - "8080:80"

volumes:
  mysql_data:
  ultrasound_uploads:
