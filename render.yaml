# Render Blueprint — free single-service deployment.
# FastAPI serves both the API and the built React frontend.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. On https://render.com → New → Blueprint → pick this repo.
#   3. Set the secret env vars when prompted, then Apply.
#   4. First build takes a few minutes (installs deps + trains the model).
#
# Note: predictions/users live in MySQL, not local disk, but Render doesn't
# bundle MySQL — point DB_HOST/DB_USER/DB_PASSWORD/DB_NAME at an external
# MySQL instance (e.g. PlanetScale, Railway). The free plan's ephemeral
# filesystem still resets uploaded prescriptions on each deploy/restart; for
# persisting those too, see README (object storage options).
services:
  - type: web
    name: pcos-care-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PCOS_ADMIN_PASS
        sync: false          # set your own admin password in the dashboard
      - key: PCOS_DOCTOR_PASS
        sync: false          # set your own doctor password in the dashboard
      - key: ALLOWED_ORIGINS
        value: "*"
      # No email provider: show the password-reset link on the Forgot
      # password page. Demo use only — anyone who knows a user's email can
      # reset their password. Set to "false" before real users sign up.
      - key: SHOW_RESET_LINK
        value: "true"
      - key: DB_HOST
        sync: false          # external MySQL host (XAMPP is local-dev only)
      - key: DB_PORT
        sync: false          # Aiven uses its own port (shown on the service page)
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false          # e.g. "defaultdb" on Aiven
      - key: DB_SSL_CA
        sync: false          # Aiven: paste the CA certificate (ca.pem) text
